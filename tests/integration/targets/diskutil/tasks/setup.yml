- name: Create a sparse disk image
  ansible.builtin.command:
    cmd: "hdiutil create -size {{ diskutil_test_image_size }} -type SPARSE {{ diskutil_test_image_base }}"
  become: true
  changed_when: true
  register: diskutil_test_create

- name: Determine the path of the disk image that was created
  ansible.builtin.set_fact:
    diskutil_test_image: "{{ diskutil_test_create.stdout.split(': ', 1)[1].strip() }}"

- name: Attach the disk image without mounting it
  ansible.builtin.command:
    cmd: "hdiutil attach -nomount {{ diskutil_test_image }}"
  become: true
  changed_when: true
  register: diskutil_test_attach

- name: Determine the whole disk and the APFS physical store of the attached disk image
  ansible.builtin.set_fact:
    # `hdiutil attach` prints the whole disk first, followed by one line per partition, followed by
    # one line for the synthesized disk of every APFS container.
    diskutil_test_disk_node: "{{ diskutil_test_attach.stdout_lines[0].split()[0] }}"
    diskutil_test_disk: "{{ diskutil_test_attach.stdout_lines[0].split()[0] | basename }}"
    diskutil_test_store: "{{ (diskutil_test_attach.stdout_lines | select('search', 'Apple_APFS') | first).split()[0] | basename }}"

- name: List the APFS containers
  community.general.diskutil:
    info_type: apfs
  become: true
  register: diskutil_test_containers

- name: Find the APFS container that uses our physical store
  ansible.builtin.set_fact:
    diskutil_test_container_entry: >-
      {{ diskutil_test_containers.containers | selectattr('physical_stores', 'contains', diskutil_test_store) | first }}

- name: Remember the APFS container and its volume
  ansible.builtin.set_fact:
    diskutil_test_container: "{{ diskutil_test_container_entry.reference }}"
    diskutil_test_container_volume: "{{ diskutil_test_container_entry.volumes[0].device_identifier }}"

- name: Verify that the disk image was attached
  ansible.builtin.assert:
    that:
      - diskutil_test_create.rc == 0
      - diskutil_test_attach.rc == 0
      - diskutil_test_disk is match('^disk[0-9]+$')
      - diskutil_test_container is match('^disk[0-9]+$')
      - diskutil_test_container_volume is match('^disk[0-9]+s[0-9]+$')
    fail_msg: >-
      hdiutil did not report a disk with an APFS container, or the container has no volume:
      {{ diskutil_test_attach.stdout_lines }}
    success_msg: >-
      Using the disk {{ diskutil_test_disk }} with the APFS container {{ diskutil_test_container }}
      and its volume {{ diskutil_test_container_volume }}

- name: Create the mount points used by the tests
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  become: true
  loop:
    - "{{ diskutil_test_mount_point }}"
    - "{{ diskutil_test_other_mount_point }}"