- name: Mount the volume of the container, because ownership cannot be changed while it is unmounted
  ansible.builtin.include_tasks: ../idempotent.yml
  vars:
    diskutil_test_params:
      state: mounted
      device: "{{ diskutil_test_container_volume }}"
    diskutil_test_expect_changed: true

- name: A volume of a fresh APFS container has its ownership disabled already
  ansible.builtin.include_tasks: ../idempotent.yml
  vars:
    diskutil_test_params:
      state: unowned
      device: "{{ diskutil_test_container_volume }}"
    diskutil_test_expect_changed: false

- name: Enabling ownership is not a no-op
  ansible.builtin.include_tasks: ../idempotent.yml
  vars:
    diskutil_test_params:
      state: owned
      device: "{{ diskutil_test_container_volume }}"
    diskutil_test_expect_changed: true

- name: Get the information of the volume
  community.general.diskutil:
    info_type: device
    device: "{{ diskutil_test_container_volume }}"
  become: true
  register: diskutil_test_ownership_owned

- name: Assert that ownership is enabled
  ansible.builtin.assert:
    that:
      - not diskutil_test_ownership_owned.ownership_disabled
    fail_msg: "Ownership is still disabled: {{ diskutil_test_ownership_owned.owners }}"

- name: Disabling ownership again is not a no-op
  ansible.builtin.include_tasks: ../idempotent.yml
  vars:
    diskutil_test_params:
      state: unowned
      device: "{{ diskutil_test_container_volume }}"
    diskutil_test_expect_changed: true

- name: Get the information of the volume again
  community.general.diskutil:
    info_type: device
    device: "{{ diskutil_test_container_volume }}"
  become: true
  register: diskutil_test_ownership_unowned

- name: Assert that ownership is disabled again
  ansible.builtin.assert:
    that:
      - diskutil_test_ownership_unowned.ownership_disabled
      - "'Enabled' not in diskutil_test_ownership_unowned.owners"
    fail_msg: "Ownership is still enabled: {{ diskutil_test_ownership_unowned.owners }}"

- name: Ownership cannot be disabled on the container itself
  community.general.diskutil:
    state: unowned
    device: "{{ diskutil_test_container }}"
  become: true
  register: diskutil_test_ownership_container
  ignore_errors: true

- name: Assert that the module refuses to disable it
  ansible.builtin.assert:
    that:
      - diskutil_test_ownership_container is failed
      - "'Ownership cannot be disabled' in diskutil_test_ownership_container.msg"
    fail_msg: "The module did not refuse to disable the ownership of an APFS container"