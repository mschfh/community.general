- name: Mount the volume of the APFS container, because ownership cannot be changed while it is unmounted
  ansible.builtin.include_tasks: ../idempotent.yml
  vars:
    diskutil_test_params:
      state: mounted
      device: "{{ diskutil_test_container_volume }}"
    diskutil_test_expect_changed: true

- name: Enabling ownership is not a no-op
  ansible.builtin.include_tasks: ../idempotent.yml
  vars:
    diskutil_test_params:
      state: owned
      device: "{{ diskutil_test_container_volume }}"
    diskutil_test_expect_changed: true

- name: Get the information of the volume
  community.general.diskutil:
    info_type: device
    device: "{{ diskutil_test_container_volume }}"
  become: true
  register: diskutil_test_ownership_info

- name: Assert that ownership is disabled
  ansible.builtin.assert:
    that:
      - diskutil_test_ownership_info.ownership_disabled
      - "'Enabled' not in diskutil_test_ownership_info.owners"

- name: Enabling ownership again is not a no-op
  ansible.builtin.include_tasks: ../idempotent.yml
  vars:
    diskutil_test_params:
      state: owned
      device: "{{ diskutil_test_container_volume }}"
    diskutil_test_expect_changed: true

- name: Get the information of the volume again
  community.general.diskutil:
    info_type: device
    device: "{{ diskutil_test_container_volume }}"
  become: true
  register: diskutil_test_ownership_info_enabled

- name: Assert that ownership is enabled again
  ansible.builtin.assert:
    that:
      - not diskutil_test_ownership_info_enabled.ownership_disabled
      - "'Enabled' in diskutil_test_ownership_info_enabled.owners"