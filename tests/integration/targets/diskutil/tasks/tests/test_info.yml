- name: List all disks
  community.general.diskutil:
    info_type: disks
  become: true
  register: diskutil_test_disks

- name: Assert that the attached disk image is part of the disk list
  ansible.builtin.assert:
    that:
      - diskutil_test_disks is not changed
      - diskutil_test_disk in diskutil_test_disks.whole_disks
      - diskutil_test_disk in (diskutil_test_disks.disks | map(attribute='device_identifier') | list)
      - diskutil_test_container in (diskutil_test_disks.disks | map(attribute='device_identifier') | list)
      - diskutil_test_container_volume in
        (diskutil_test_disks.partitions | map(attribute='device_identifier') | list)
    fail_msg: >-
      {{ diskutil_test_disk }}, {{ diskutil_test_container }} and {{ diskutil_test_container_volume }} are not
      part of {{ diskutil_test_disks }}

- name: Get the information of the volume of the APFS container
  community.general.diskutil:
    info_type: device
    device: "{{ diskutil_test_container_volume }}"
  become: true
  register: diskutil_test_volume_info

- name: Assert the information of the volume
  ansible.builtin.assert:
    that:
      - diskutil_test_volume_info is not changed
      - diskutil_test_volume_info.device == diskutil_test_container_volume
      - diskutil_test_volume_info.filesystem == 'APFS'
      - not diskutil_test_volume_info.whole_disk
      - diskutil_test_volume_info.container_reference == diskutil_test_container

- name: Get the information of the volume by its device node
  community.general.diskutil:
    info_type: device
    device: "/dev/{{ diskutil_test_container_volume }}"
  become: true
  register: diskutil_test_volume_node_info

- name: Assert that the device node resolves to the same device
  ansible.builtin.assert:
    that:
      - diskutil_test_volume_node_info.device == diskutil_test_container_volume

- name: List all APFS containers
  community.general.diskutil:
    info_type: apfs
  become: true
  register: diskutil_test_apfs

- name: Assert that our APFS container is listed with its volume
  ansible.builtin.assert:
    that:
      - diskutil_test_apfs is not changed
      - diskutil_test_container in (diskutil_test_apfs.containers | map(attribute='reference') | list)
      - diskutil_test_container_volume in
        (diskutil_test_apfs.containers | selectattr('reference', 'equalto', diskutil_test_container) | first).volumes
        | map(attribute='device_identifier') | list

- name: List all APFS volume groups
  community.general.diskutil:
    info_type: volume_groups
  become: true
  register: diskutil_test_volume_groups

- name: Assert that the APFS volume groups are a list
  ansible.builtin.assert:
    that:
      - diskutil_test_volume_groups is not changed
      - diskutil_test_volume_groups.volume_groups is sequence

- name: List all file systems
  community.general.diskutil:
    info_type: filesystems
  become: true
  register: diskutil_test_filesystems

- name: Assert that APFS can be used for erasing
  ansible.builtin.assert:
    that:
      - diskutil_test_filesystems is not changed
      - "'APFS' in diskutil_test_filesystems.filesystems"

- name: Run all read-only queries in check mode
  community.general.diskutil:
    info_type: "{{ item }}"
    device: "{{ diskutil_test_container_volume }}"
  become: true
  check_mode: true
  loop:
    - disks
    - device
    - apfs
    - volume_groups
    - filesystems
  register: diskutil_test_check_mode

- name: Assert that check mode never reports a change
  ansible.builtin.assert:
    that:
      - not (diskutil_test_check_mode.results | map(attribute='changed') | select('truthy') | list | length > 0)
    fail_msg: "A read-only query reported a change in check mode"