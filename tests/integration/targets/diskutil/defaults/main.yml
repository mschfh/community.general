# The tests work on a throwaway sparse disk image, so they never touch a real disk of the host.
# `hdiutil create -type SPARSE` appends `.sparseimage` to the given path, and it gives the image an EFI
# partition and an APFS container. The devices are determined in `tasks/setup.yml`.
diskutil_test_image_size: 4096m
diskutil_test_image_base: "/tmp/diskutil-test-{{ inventory_hostname }}-{{ ansible_date_time.epoch }}.dmg"
# The mount points are not placed under /tmp, because diskutil reports the resolved path of a mount point,
# and /tmp is a symlink to /private/tmp.
diskutil_test_mount_point: "/Volumes/diskutil-test-mount-{{ inventory_hostname }}-{{ ansible_date_time.epoch }}"
diskutil_test_other_mount_point: "/Volumes/diskutil-test-mount-other-{{ inventory_hostname }}-{{ ansible_date_time.epoch }}"
diskutil_test_apfs_volume: DiskutilTestData
diskutil_test_renamed_volume: DiskutilTestRenamed
diskutil_test_mount_volume: DiskutilTestMount
diskutil_test_scratch_volume: DiskutilTestScratch