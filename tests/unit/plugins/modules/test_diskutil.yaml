test_cases:
  - id: test_missing_input
    input: {}
    output:
      failed: true
      msg: "one of the following is required: state, info_type"

  - id: test_state_and_info_type_are_mutually_exclusive
    input:
      state: mounted
      device: disk0s1
      info_type: disks
    output:
      failed: true
      msg: "parameters are mutually exclusive: state|info_type"

  # -- read-only queries ------------------------------------------------------------

  - id: test_info_disks
    input:
      info_type: disks
    output:
      changed: false
      whole_disks: [disk0]
      disks: [*disk_disk0]
      partitions: [*partition_disk0s1]
    mocks:
      run_command:
        - command: [/testbin/diskutil, list, -plist]
          environ: *env
          rc: 0
          out: *list_disk0
          err: ''

  - id: test_info_device
    input:
      info_type: device
      device: disk0s1
    output:
      changed: false
      device: disk0s1
      device_node: /dev/disk0s1
      whole_disk: false
      volume_name: data
      volume_uuid: 11111111-2222-3333-4444-555555555555
      volume_is_mounted: true
      mount_point: /Volumes/data
      filesystem: APFS
      content: Apple_APFS
      owners: [Enabled]
      ownership_disabled: false
      container_reference: disk0s1
      apfs_role: Data
    mocks:
      run_command:
        - command: [/testbin/diskutil, info, disk0s1, -plist]
          environ: *env
          rc: 0
          out: *info_mounted
          err: ''

  - id: test_info_device_without_device
    input:
      info_type: device
    output:
      failed: true
      msg: The 'device' option is required for this operation
    mocks:
      run_command: []

  - id: test_info_apfs
    input:
      info_type: apfs
    output:
      changed: false
      containers:
        - reference: disk0s1
          capacity: 500107862016
          capacity_free: 223456789012
          physical_stores: [disk0]
          volumes:
            - device_identifier: disk0s1
              name: Macintosh HD
              uuid: 11111111-2222-3333-4444-555555555555
              capacity: 500107753472
              capacity_free: 223456789012
              role: System
              encrypted: false
              filevault: false
              system: true
              boot: true
              time_machine: false
              apfs_group: AAAAAAAA-1111-2222-3333-444455556666
            - device_identifier: disk0s2
              name: Data
              uuid: 99999999-8888-7777-6666-555555555555
              capacity: 100000000000
              capacity_free: 90000000000
              role: null
              encrypted: false
              filevault: false
              system: false
              boot: false
              time_machine: false
              apfs_group: null
    mocks:
      run_command:
        - command: [/testbin/diskutil, apfs, list, -plist]
          environ: *env
          rc: 0
          out: *apfs_with_data
          err: ''

  - id: test_info_volume_groups
    input:
      info_type: volume_groups
    output:
      changed: false
      volume_groups:
        - APFSVolumeGroupUUID: AAAAAAAA-1111-2222-3333-444455556666
          APFSVolumeGroupIdentifiers: [disk0s1, disk0s2]
    mocks:
      run_command:
        - command: [/testbin/diskutil, apfs, listVolumeGroups, -plist]
          environ: *env
          rc: 0
          out: *apfs_volume_groups
          err: ''

  - id: test_info_filesystems
    input:
      info_type: filesystems
    output:
      changed: false
      filesystems: [APFS, HFS, HFS+J, MS-DOS, ExFAT]
    mocks:
      run_command:
        - command: [/testbin/diskutil, listFilesystems]
          environ: *env
          rc: 0
          out: |
            APFS
            HFS
            HFS+J
            MS-DOS
            ExFAT
          err: ''

  - id: test_info_mountinfo
    input:
      info_type: mountinfo
      device: disk0s1
    output:
      changed: false
      mount_info:
        MountPoint: /Volumes/data
        MountedVolume: true
        MountedWritableVolume: true
        SyntheticRoot: false
    mocks:
      run_command:
        - command: [/testbin/diskutil, mountinfo, disk0s1, -plist]
          environ: *env
          rc: 0
          out: *mountinfo_mounted
          err: ''

  # -- mount state ------------------------------------------------------------------

  - id: test_mounted_noop
    input:
      state: mounted
      device: disk0s1
    output:
      changed: false
      volume_is_mounted: true
    mocks:
      run_command:
        - command: [/testbin/diskutil, info, disk0s1, -plist]
          environ: *env
          rc: 0
          out: *info_mounted
          err: ''

  - id: test_mounted_at_requested_mount_point
    input:
      state: mounted
      device: disk0s1
      mount_point: /Volumes/data
    output:
      changed: false
