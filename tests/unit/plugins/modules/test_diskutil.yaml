test_cases:
- id: test_missing_input
  output:
    failed: true
    msg: 'one of the following is required: state, info_type'
  mocks:
    run_command: []
- id: test_state_and_info_type_are_mutually_exclusive
  input:
    state: mounted
    device: disk8s1
    info_type: disks
  output:
    failed: true
    msg: 'parameters are mutually exclusive: state|info_type'
  mocks:
    run_command: []
- id: test_info_disks
  input:
    info_type: disks
  output:
    changed: false
    whole_disks:
    - disk7
    disks: *disks_new
  mocks:
    run_command:
    - command:
      - /testbin/diskutil
      - list
      - -plist
      environ: *env
      rc: 0
      out: *list_new
      err: ''
- id: test_info_disks_old_schema
  input:
    info_type: disks
  output:
    changed: false
    whole_disks:
