# TEMPORARY workflow, not meant to be merged upstream.
#
# The regular CI of community.general runs on Azure Pipelines, which cannot be triggered from a
# branch of a fork. This workflow runs the checks for the new `diskutil` module on a real macOS
# runner instead. It is deliberately limited to the new module, so that it does not consume more
# CI resources than needed while the module is being developed.

name: macOS diskutil

'on':
  push:
    branches:
      - diskutil-module
  workflow_dispatch:

concurrency:
  # Make sure there is at most one active run per branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COLLECTION_ROOT: ansible_collections/community/general
  ANSIBLE_CORE: ">=2.20,<2.21"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint the new module
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out the collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # ansible-test requires the collection to live at .../ansible_collections/community/general
          path: ${{ env.COLLECTION_ROOT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ansible-core
        run: python -m pip install "ansible-core${{ env.ANSIBLE_CORE }}"

      - name: Report the platform
        run: |
          sw_vers
          which diskutil
          diskutil list

      - name: Install ruff
        run: python -m pip install "ruff==0.16.10"

      - name: Check the formatting of the new Python files
        run: |
          ruff check --config ruff-modules.toml \
            plugins/modules/diskutil.py \
            tests/unit/plugins/modules/test_diskutil.py
          ruff format --check --config ruff-modules.toml \
            plugins/modules/diskutil.py \
            tests/unit/plugins/modules/test_diskutil.py
        working-directory: ${{ env.COLLECTION_ROOT }}

      - name: Run the sanity tests for the new files
        run: |
          ansible-test sanity --color no \
            plugins/modules/diskutil.py \
            tests/unit/plugins/modules/test_diskutil.py \
            tests/unit/plugins/modules/test_diskutil.yaml \
            tests/integration/targets/diskutil/aliases \
            tests/integration/targets/diskutil/defaults/main.yml \
            tests/integration/targets/diskutil/tasks/main.yml \
            tests/integration/targets/diskutil/tasks/setup.yml \
            tests/integration/targets/diskutil/tasks/teardown.yml \
            tests/integration/targets/diskutil/tasks/idempotent.yml \
            tests/integration/targets/diskutil/tasks/tests/test_info.yml \
            tests/integration/targets/diskutil/tasks/tests/test_apfs_volume.yml \
            tests/integration/targets/diskutil/tasks/tests/test_mount.yml \
            tests/integration/targets/diskutil/tasks/tests/test_ownership.yml \
            tests/integration/targets/diskutil/tasks/tests/test_erase.yml
        working-directory: ${{ env.COLLECTION_ROOT }}

      - name: Run the extra sanity checks
        run: |
          pip install pydantic
          python tests/sanity/extra/botmeta.py
          python tests/sanity/extra/aliases.py
        working-directory: ${{ env.COLLECTION_ROOT }}

  test:
    name: Run the unit and integration tests on macOS
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      # Needed to push the log files of this job to the `ci-output` branch, because the GitHub
      # Actions log endpoints require authentication and the developer of this branch is not.
      contents: write
    steps:
      - name: Check out the collection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: ${{ env.COLLECTION_ROOT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ansible-core
        run: python -m pip install "ansible-core${{ env.ANSIBLE_CORE }}"

      - name: Install the collection dependencies
        run: |
          ansible-galaxy collection install \
            community.internal_test_tools \
            community.library_inventory_filtering_v1 \
            -p ansible_collections

      - name: Install the test requirements
        run: |
          python -m pip install --upgrade "pytest<9" pytest-xdist pytest-mock
          python -m pip list

      - name: Report the platform
        run: |
          sw_vers
          ansible-test --version
          which python
          python -c "import pytest; print('pytest', pytest.__version__)"
          sudo -n true && echo "passwordless sudo works"

      - name: Run the unit tests of the new module
        id: units
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ansible-test units --color no \
            tests/unit/plugins/modules/test_diskutil.py \
            --python-interpreter "$(command -v python)" -v 2>&1 | tee /tmp/units.log
        working-directory: ${{ env.COLLECTION_ROOT }}

      - name: Run the integration tests of the new module
        id: integration
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ansible-test integration --color no \
            diskutil \
            --allow-root \
            --allow-destructive \
            --python-interpreter "$(command -v python)" -v 2>&1 | tee /tmp/integration.log
        working-directory: ${{ env.COLLECTION_ROOT }}

      - name: Exercise diskutil on a throwaway disk image
        if: always()
        shell: bash
        run: |
          WORK=$(mktemp -d)
          mkdir -p ci-output/plists
          LOG=ci-output/battery.txt
          say() { echo "$@" | tr -d '\r' >> "$LOG"; }
          note() { say ""; say "################ $*"; }
          snap() {
            say "### $1"
            diskutil info -plist "$2" > "ci-output/plists/$1" 2>&1 || true
            say "snap $1 done"
          }
          checkpoint() {
            say "---- checkpoint $*"
            diskutil list 2>&1 | grep -E "^/dev/disk" >> "$LOG" || say "(no disks)"
          }

          note "create a raw sparse image without -fs"
          hdiutil create -size 4096m -type SPARSE "$WORK/i.dmg" 2>&1 | tr -d '\r' >> "$LOG" || true
          OUT=$(sudo hdiutil attach -nomount "$WORK/i.dmg.sparseimage" 2>&1 || true)
          say "$OUT"
          DEV=$(echo "$OUT" | head -1 | awk '{print $1}' | xargs basename)
          CONT=$(echo "$OUT" | grep -m1 EF57347C | awk '{print $1}' | xargs basename)
          VOL=$(echo "$OUT" | grep -m1 41504653 | awk '{print $1}' | xargs basename)
          say "DEV=$DEV CONT=$CONT VOL=$VOL"
          checkpoint after-attach

          note "read only queries"
          diskutil list -plist > ci-output/plists/list.xml 2>&1 || true
          diskutil apfs list -plist > ci-output/plists/apfs-list.xml 2>&1 || true
          diskutil apfs listVolumeGroups -plist > ci-output/plists/apfs-volume-groups.xml 2>&1 || true
          snap info-whole-disk.xml "$DEV"
          snap info-store.xml "${DEV}s2"
          snap info-container-volume.xml "$VOL"
          say "### diskutil info (text) of the container volume"
          diskutil info "$VOL" 2>&1 | tr -d '\r' >> "$LOG" || true
          say "### diskutil listFilesystems"
          diskutil listFilesystems 2>&1 | tr -d '\r' >> "$LOG" || true

          note "ownership needs a mounted volume"
          sudo diskutil mount "$VOL" 2>&1 | tr -d '\r' >> "$LOG" || true
          snap info-container-volume-mounted.xml "$VOL"
          sudo diskutil disableOwnership "$VOL" 2>&1 | tr -d '\r' >> "$LOG" || true
          snap info-container-volume-unowned.xml "$VOL"
          sudo diskutil enableOwnership "$VOL" 2>&1 | tr -d '\r' >> "$LOG" || true
          snap info-container-volume-owned.xml "$VOL"
          checkpoint after-ownership

          note "unmount"
          sudo diskutil unmount "$VOL" 2>&1 | tr -d '\r' >> "$LOG" || true
          snap info-container-volume-unmounted.xml "$VOL"

          note "eraseVolume of the container volume"
          sudo diskutil eraseVolume APFS DiagEraseContainer "$VOL" 2>&1 | tr -d '\r' >> "$LOG" || true
          say "eraseVolume done"
          snap info-container-volume-erased.xml "$VOL"
          diskutil list -plist > ci-output/plists/list-after-erase-volume.xml 2>&1 || true
          checkpoint after-erase-volume

          note "eraseDisk"
          sudo diskutil eraseDisk APFS DiagEraseDisk GPT "$DEV" 2>&1 | tr -d '\r' >> "$LOG" || true
          say "eraseDisk done"
          diskutil list -plist > ci-output/plists/list-after-erase-disk.xml 2>&1 || true
          diskutil apfs list -plist > ci-output/plists/apfs-list-after-erase-disk.xml 2>&1 || true
          checkpoint after-erase-disk

          note "apfs addVolume, several ways"
          for candidate in "$CONT" "${DEV}s2" "$DEV" "/dev/$CONT"; do
            say "--- addVolume into $candidate"
            diskutil apfs list | tr -d '\r' | grep -m2 -E "Container Reference|Volume " >> "$LOG" || true
            sudo diskutil apfs addVolume "$candidate" APFS "DiagVol$(echo "$candidate" | tr -dc 'a-zA-Z0-9')" 2>&1 | tr -d '\r' >> "$LOG" || true
            checkpoint "after-addVolume-$candidate"
            diskutil apfs list -plist > "ci-output/plists/apfs-list-after-add-$(echo "$candidate" | tr -dc 'a-zA-Z0-9').xml" 2>&1 || true
          done
          diskutil apfs list 2>&1 | tr -d '\r' >> "$LOG" || true

          note "detach"
          sudo hdiutil detach -force "$DEV" 2>&1 | tr -d '\r' >> "$LOG" || true
          rm -rf "$WORK"
        working-directory: ${{ env.COLLECTION_ROOT }}

      - name: Verify that the tests really ran
        if: always()
        run: |
          status=0
          for log in /tmp/units.log /tmp/integration.log; do
            if grep -qE "ansible-test (units|integration): error:|No module named pytest|All targets skipped" "$log"; then
              echo "::error::$log did not run the tests"
              status=1
            fi
          done
          if ! grep -qE "[0-9]+ passed" /tmp/units.log; then
            echo "::error::The unit tests did not report any passing test"
            status=1
          fi
          if ! grep -q "PLAY RECAP" /tmp/integration.log; then
            echo "::error::The integration tests did not run any play"
            status=1
          fi
          if grep -qE "[0-9]+ failed|[0-9]+ error" /tmp/units.log; then
            echo "::error::The unit tests reported failures"
            status=1
          fi
          if grep -qE "failed=[1-9]|unreachable=[1-9]" /tmp/integration.log; then
            echo "::error::The integration tests reported failures"
            status=1
          fi
          exit $status
        working-directory: ${{ env.COLLECTION_ROOT }}

      - name: Collect the results
        if: always()
        run: |
          echo "unit tests:      ${{ steps.units.outcome }}"  > /tmp/status.txt
          echo "integration tests: ${{ steps.integration.outcome }}" >> /tmp/status.txt
          echo "" >> /tmp/status.txt
          echo "### disks still attached" >> /tmp/status.txt
          diskutil list >> /tmp/status.txt 2>&1 || true
          mkdir -p ci-output
          cp /tmp/status.txt /tmp/units.log /tmp/integration.log ci-output/ 2>/dev/null || true
          if [ -d tests/output ]; then
            find tests/output -type f \( -name "result.yml" -o -name "*.json" -o -name "*.txt" -o -name "*.log" \) \
              -exec sh -c 'echo "--- {} ---"; tail -n 400 "$1"' _ {} \; \
              > ci-output/test-output.txt 2>&1 || true
          fi
        working-directory: ${{ env.COLLECTION_ROOT }}

      - name: Publish the results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-output
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -p "$(git rev-parse HEAD)" -m "ci: logs of run ${{ github.run_id }}")
          git push --force origin "$COMMIT:refs/heads/ci-output"
        working-directory: ${{ env.COLLECTION_ROOT }}

      - name: Fail if a test failed
        if: steps.units.outcome == 'failure' || steps.integration.outcome == 'failure'
        run: |
          echo "unit tests: ${{ steps.units.outcome }}, integration tests: ${{ steps.integration.outcome }}"
          echo "See https://github.com/mschfh/community.general/tree/ci-output/ci-output for the logs"
          exit 1
